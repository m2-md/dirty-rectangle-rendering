<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirli Dikdörtgen Tekniği — Canvas 2D</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 12px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      .stage {
        position: relative;
        width: 640px;
        height: 360px;
        background: #0b1220;
        border: 1px solid #334155;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
      }
      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: center;
        max-width: 660px;
        font-size: 13px;
      }
      .panel label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #hud {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.6;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 10px 14px;
        min-width: 340px;
      }
      #hud b {
        color: #38bdf8;
      }
      .hint {
        max-width: 640px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>Kirli dikdörtgen tekniği — sadece değişen yeri sil</h1>

    <!-- Katmanlı canvas: alt katman statik, üst katman hareketliler -->
    <div class="stage">
      <canvas id="bg" width="640" height="360"></canvas>
      <canvas id="fg" width="640" height="360"></canvas>
    </div>

    <div class="panel">
      <label>
        mod
        <select id="mode">
          <option value="dirty-rect">dirty-rect</option>
          <option value="full-redraw">full-redraw</option>
          <option value="layered">layered</option>
        </select>
      </label>
      <label>
        hareketli <input id="moving" type="range" min="0" max="400" value="20" />
        <span id="movingOut">20</span>
      </label>
      <label>
        maxWaste
        <input id="maxWaste" type="range" min="0" max="32000" step="500" value="2000" />
        <span id="maxWasteOut">2000</span>
      </label>
      <label>
        <input id="visualize" type="checkbox" /> kirli bölgeleri çerçevele
      </label>
      <label><input id="pad" type="checkbox" checked /> AA payı (1px)</label>
    </div>

    <div id="hud"></div>

    <p class="hint">
      <b>pad</b> kutusunu kapatın: kirli dikdörtgen tam geometrik sınıra kırpılır ve
      hareketli nesnelerin arkasında anti-aliasing artığı soluk bir iz kalır. Çerçeveleme
      açıkken çizilen kırmızı kutular bir sonraki karede kirli sayılır, yoksa ekranda
      birikirler.
    </p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
